<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e323c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zombie Rush">
  <title>Zombie Rush</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="profile" id="profile-btn" aria-label="Change name">
        <span class="avatar"><canvas id="avatar-canvas" width="96" height="96"></canvas><span class="avatar-lvl tx" id="profile-lvl">1</span></span>
        <span class="profile-text">
          <span class="profile-name tx" id="profile-name">Rookie</span>
          <span class="profile-power tx"><i data-icon="bolt"></i><span id="profile-power">0</span></span>
        </span>
      </button>
      <button class="currency" data-goto="0" aria-label="Coins, open shop"><i data-icon="coin"></i><span class="tx" id="coins">0</span><b data-icon="plus"></b></button>
      <button class="currency" data-goto="0" aria-label="Gems, open shop"><i data-icon="gem"></i><span class="tx" id="gems">0</span><b data-icon="plus"></b></button>
    </header>

    <main class="screens">
      <div class="track" id="track">
        <section class="screen" id="screen-shop"></section>
        <section class="screen" id="screen-gear"></section>
        <section class="screen" id="screen-play"></section>
        <section class="screen" id="screen-skills"></section>
        <section class="screen" id="screen-modes"></section>
      </div>
    </main>

    <nav class="navbar" id="navbar">
      <button class="tab" data-tab="0" data-icon="shop"><i></i><span class="tab-label tx">Shop</span></button>
      <button class="tab" data-tab="1" data-icon="gear"><i></i><span class="tab-label tx">Gear</span></button>
      <button class="tab" data-tab="2" data-icon="play"><i></i><span class="tab-label tx">Battle</span></button>
      <button class="tab" data-tab="3" data-icon="skills"><i></i><span class="tab-label tx">Skills</span></button>
      <button class="tab" data-tab="4" data-icon="modes"><i></i><span class="tab-label tx">Modes</span></button>
    </nav>

    <div id="game-view" hidden>
      <canvas id="game-canvas"></canvas>
      <div class="hud">
        <div class="hud-top">
          <button class="hud-mute" id="hud-mute" aria-label="Mute"></button>
          <div class="hud-hp">
            <i class="hud-hp-icon" data-icon="heart"></i>
            <div class="hud-hp-bar"><div class="hud-hp-fill" id="hud-hp-fill"></div><span class="hud-hp-text tx" id="hud-hp-text">100</span></div>
          </div>
          <div class="hud-pill squad"><i data-icon="helmet"></i><span class="tx" id="hud-kills">0</span></div>
          <button class="hud-pause" id="hud-pause" aria-label="Pause"></button>
        </div>
        <div class="hud-stage">
          <div class="hud-level tx" id="hud-level"></div>
          <div class="hud-progress">
            <div class="hud-progress-track"><div class="hud-progress-fill" id="hud-progress-fill"></div></div>
            <i class="hud-boss-badge" data-icon="skull"></i>
          </div>
        </div>
        <div class="hud-boss" id="hud-boss" hidden>
          <div class="hud-boss-name tx" id="hud-boss-name"></div>
          <div class="hud-boss-bar"><div class="hud-boss-fill" id="hud-boss-fill"></div><span class="hud-boss-hp tx" id="hud-boss-hp"></span></div>
        </div>
        <div class="hud-buffs" id="hud-buffs"></div>
        <div class="hud-banner" id="hud-banner" hidden></div>
        <div class="hud-hint tx" id="hud-hint">Drag to move</div>
        <div class="abilities left" id="ab-left"></div>
        <div class="abilities right" id="ab-right"></div>
      </div>
    </div>

    <div id="arena-view" hidden>
      <canvas id="arena-canvas"></canvas>
      <div class="ahud">
        <div class="ahud-xp"><div class="ahud-xp-fill" id="ax-xp"></div><span class="ahud-lvl tx" id="ax-lvl">Lv 1</span></div>
        <div class="hud-top">
          <div class="hud-hp">
            <i class="hud-hp-icon" data-icon="heart"></i>
            <div class="hud-hp-bar"><div class="hud-hp-fill" id="ax-hp"></div><span class="hud-hp-text tx" id="ax-hpText">100</span></div>
          </div>
          <div class="hud-pill"><i data-icon="skull"></i><span class="tx" id="ax-kills">0</span></div>
          <button class="hud-pause" id="ax-pause" aria-label="Pause"></button>
        </div>
        <div class="ahud-row">
          <span class="ahud-chip tx"><i data-icon="calendar"></i><span id="ax-time">0:00</span></span>
          <span class="ahud-chip loot tx"><i data-icon="coin"></i><span id="ax-loot">0</span></span>
          <span class="ahud-chip ammo tx" id="ax-ammo" hidden><i data-icon="rifle"></i><span>30</span></span>
        </div>
        <div class="ahud-obj tx" id="ax-obj"></div>
        <div class="ahud-banner" id="ax-banner" hidden></div>
      </div>
      <div class="ahud-levelup" id="ax-levelup" hidden></div>
    </div>

    <div id="modal" class="modal" hidden></div>
    <div class="ad-view" id="ad-view" hidden>
        <div class="ad-top"><span class="ad-tag tx">AD</span><span class="ad-timer tx" id="ad-timer"></span><button class="ad-close" id="ad-close" aria-label="Close ad">✕</button></div>
        <div class="ad-body" id="ad-body"></div>
        <div class="ad-bottom"><div class="ad-bar"><div class="ad-bar-fill" id="ad-bar-fill"></div></div><button class="btn green ad-claim" id="ad-claim" disabled><span class="tx" id="ad-claim-text"></span></button></div>
    </div>
    <div id="toast" class="toast tx" hidden></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/save.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/arena.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
