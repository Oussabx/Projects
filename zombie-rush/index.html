<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e323c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zombie Rush">
  <title>Zombie Rush</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="profile" id="profile-btn" aria-label="Profile">
        <canvas id="avatar-canvas" width="80" height="80"></canvas>
        <div>
          <div class="profile-name" id="profile-name">Rookie</div>
          <div class="profile-power">⚡ <span id="profile-power">0</span></div>
        </div>
      </button>
      <div class="currency"><span class="cur-icon" data-icon="coin"></span><span id="coins">0</span></div>
      <div class="currency"><span class="cur-icon" data-icon="gem"></span><span id="gems">0</span></div>
    </header>

    <main class="screens">
      <div class="track" id="track">
        <section class="screen" id="screen-shop"></section>
        <section class="screen" id="screen-gear"></section>
        <section class="screen" id="screen-play"></section>
        <section class="screen" id="screen-skills"></section>
        <section class="screen" id="screen-ranks"></section>
      </div>
    </main>

    <nav class="navbar" id="navbar">
      <button data-tab="0" data-icon="shop"><i></i><span>Shop</span></button>
      <button data-tab="1" data-icon="gear"><i></i><span>Gear</span></button>
      <button data-tab="2" data-icon="play" class="center"><i></i><span>Play</span></button>
      <button data-tab="3" data-icon="skills"><i></i><span>Skills</span></button>
      <button data-tab="4" data-icon="ranks"><i></i><span>Ranks</span></button>
    </nav>

    <div id="game-view" hidden>
      <canvas id="game-canvas"></canvas>
      <div class="hud">
        <div class="hud-top">
          <div class="hud-hp">
            <div class="hud-hp-fill" id="hud-hp-fill"></div>
            <span class="hud-hp-text">❤ <span id="hud-hp-text">100</span></span>
          </div>
          <div class="hud-kills">💀 <span id="hud-kills">0</span></div>
          <button class="hud-pause" id="hud-pause" aria-label="Pause"></button>
        </div>
        <div class="hud-level" id="hud-level"></div>
        <div class="hud-progress"><div class="hud-progress-fill" id="hud-progress-fill"></div><span class="hud-skull">☠</span></div>
        <div class="hud-boss" id="hud-boss" hidden>
          <div class="hud-boss-name" id="hud-boss-name"></div>
          <div class="hud-boss-bar"><div class="hud-boss-fill" id="hud-boss-fill"></div></div>
        </div>
        <div class="hud-buffs" id="hud-buffs"></div>
        <div class="hud-banner" id="hud-banner" hidden></div>
        <div class="hud-hint" id="hud-hint">Drag to move</div>
      </div>
    </div>

    <div id="modal" class="modal" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/save.js"></script>
  <script src="js/art.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
