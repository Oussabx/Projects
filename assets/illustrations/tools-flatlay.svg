<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#f1e9ff"/>
  <!-- comb -->
  <g transform="rotate(-25 90 150)">
    <rect x="60" y="130" width="90" height="26" rx="8" fill="#241f5c"/>
    <rect x="65" y="156" width="6" height="24" fill="#241f5c"/>
    <rect x="78" y="156" width="6" height="24" fill="#241f5c"/>
    <rect x="91" y="156" width="6" height="24" fill="#241f5c"/>
    <rect x="104" y="156" width="6" height="24" fill="#241f5c"/>
    <rect x="117" y="156" width="6" height="24" fill="#241f5c"/>
    <rect x="130" y="156" width="6" height="24" fill="#241f5c"/>
  </g>
  <!-- scissors -->
  <g transform="translate(150 60) rotate(20)">
    <circle cx="0" cy="70" r="14" fill="none" stroke="#a98cf5" stroke-width="7"/>
    <circle cx="34" cy="70" r="14" fill="none" stroke="#a98cf5" stroke-width="7"/>
    <path d="M6 62L70 6M6 78L70 128" stroke="#241f5c" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- brush -->
  <g transform="translate(170 190) rotate(15)">
    <rect x="0" y="0" width="26" height="70" rx="12" fill="#ffc24b"/>
    <rect x="4" y="76" width="18" height="50" rx="8" fill="#241f5c"/>
  </g>
  <!-- bottle -->
  <g transform="translate(70 190)">
    <rect x="0" y="14" width="34" height="60" rx="8" fill="#a98cf5"/>
    <rect x="10" y="0" width="14" height="18" rx="4" fill="#241f5c"/>
  </g>
</svg>
